<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canopy Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bar: #0F1513; --ink: #E3EAE6; --muted: #92A29A; --line: #26312C; --moss: #5DAE84; --sun: #E8AE4E;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--bar); border-bottom: 1px solid var(--line); }
  .back { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .back svg { width: 24px; height: 24px; }
  .back span { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .title { font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .tool { font: 600 13px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .tool:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  main { flex: 1; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .msg { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; padding: 16px; color: var(--muted); }
  .msg a { color: var(--moss); }
  @media (max-width: 620px) { .back span, .sep, #direct, #fbBtn { display: none; } #slotBtn { max-width: 150px; } .slotmenu { position: fixed; left: 12px; right: 12px; top: 56px; width: auto; } }
  .toast { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: #15201B; color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--sun); border-radius: 12px; padding: 10px 14px; font: 500 14px var(--body); box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: min(360px, calc(100vw - 32px)); animation: pop .25s ease; }
  .toast b { display: block; font: 700 15px var(--display); }
  @keyframes pop { from { transform: translateY(10px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  dialog { background: #161F1B; color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { font: 800 20px var(--display); margin: 0 0 6px; }
  dialog p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .stars { display: flex; gap: 6px; margin-bottom: 12px; }
  .stars button { font: 700 14px var(--body); width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  .stars button[aria-pressed="true"] { background: var(--moss); color: #0F1513; border-color: transparent; }
  dialog textarea { width: 100%; min-height: 110px; font: 15px var(--body); color: var(--ink); background: #111A16; border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
  .slotwrap { position: relative; }
  #slotBtn { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  .slotmenu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 280px; background: #161F1B; border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .slotmenu .it { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: 500 14px var(--body); color: var(--ink); background: none; border: 0; border-radius: 9px; padding: 8px 10px; cursor: pointer; }
  .slotmenu .it:hover, .slotmenu .it:focus-visible { background: #1F2A25; }
  .slotmenu .it[aria-checked="true"]::before { content: "●"; color: var(--moss); }
  .slotmenu .it[aria-checked="false"]::before { content: "○"; color: var(--muted); }
  .slotmenu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .slotmenu .act { color: var(--moss); font-weight: 600; }
  .slotmenu form { display: flex; gap: 6px; padding: 4px; }
  .slotmenu input { flex: 1; min-width: 0; font: 14px var(--body); color: var(--ink); background: #111A16; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .slotmenu .hint { font-size: 12px; color: var(--muted); padding: 4px 10px 2px; }
  .cover { position: absolute; inset: 0; display: grid; place-content: center; background: rgba(15,21,19,.85); color: var(--ink); font: 600 15px var(--body); z-index: 5; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="./" aria-label="Zurück zu Canopy Base">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22a13 13 0 0 1 26 0z" fill="var(--moss)"/><path d="M8 22a8 8 0 0 1 16 0z" fill="var(--sun)"/><rect x="15" y="22" width="2" height="7" rx="1" fill="var(--ink)"/></svg>
      <span>Canopy</span>
    </a>
    <div class="sep"></div>
    <div class="title" id="title">Wird geladen</div>
    <div class="spacer"></div>
    <div class="slotwrap" id="slotWrap" hidden>
      <button class="tool" id="slotBtn" type="button" aria-haspopup="true" aria-expanded="false">Spielstand</button>
      <div class="slotmenu" id="slotMenu" hidden></div>
    </div>
    <a class="tool" id="who" hidden></a>
    <a class="tool" id="direct" target="_blank" rel="noopener" hidden>In neuem Tab</a>
    <button class="tool" id="fbBtn" type="button">Feedback</button>
    <button class="tool" id="full" type="button">Vollbild</button>
  </div>
  <main id="stage"></main>
  <dialog id="fb" aria-labelledby="fbTitle">
    <form method="dialog" id="fbForm">
      <h2 id="fbTitle">Feedback</h2>
      <p>Was gefällt dir, was nervt, was fehlt? Geht direkt an den Entwickler.</p>
      <div class="stars" role="group" aria-label="Bewertung 1 bis 5"></div>
      <textarea id="fbText" maxlength="2000" placeholder="Dein Feedback" aria-label="Dein Feedback"></textarea>
      <p id="fbMsg" style="margin:8px 0 0"></p>
      <div class="row"><button class="tool" value="cancel" type="button" id="fbCancel">Abbrechen</button><button class="tool" id="fbSend" type="submit" style="background:var(--moss);color:#0F1513;border-color:transparent">Senden</button></div>
    </form>
  </dialog>

<script type="module">
import * as id from './js/canopy-id.js';

const gameKey = new URLSearchParams(location.search).get('g');
const stage = document.getElementById('stage');
const fail = (text) => { stage.innerHTML = `<div class="msg"><p>${text}</p><p><a href="./">Zurück zu allen Spielen</a></p></div>`; };
let frame = null, game = null, origin = '*', gameSaidHello = false;

// ---------- Mehrere Spielstände ----------
let slots = { active: 1, list: [{ id: 1, name: 'Hauptstand' }] };
let slotsReady = Promise.resolve();
const flushWait = {};
let switching = false; // während eines Wechsels keine Speicherungen des alten Spiels annehmen
const slotName = () => slots.list.find((x) => x.id === slots.active)?.name || 'Hauptstand';
function askFlush() {
  // Spiel bitten, ungespeicherte Änderungen hochzuladen (höchstens 5 s warten).
  const reqId = 'f' + Date.now();
  return new Promise((res) => { flushWait[reqId] = res; send({ type: 'flush', reqId }); setTimeout(res, 5000); });
}
function renderSlotBtn() {
  const b = document.getElementById('slotBtn');
  b.textContent = `${slotName()} ▾`;
  b.title = 'Spielstand wechseln';
}
function closeSlotMenu() { document.getElementById('slotMenu').hidden = true; document.getElementById('slotBtn').setAttribute('aria-expanded', 'false'); }
function renderSlotMenu(mode) {
  const menu = document.getElementById('slotMenu');
  const escH = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (mode === 'new' || mode === 'rename') {
    menu.innerHTML = `<div class="hint">${mode === 'new' ? 'Neuer, leerer Spielstand' : 'Spielstand umbenennen'}</div>
      <form id="slotForm"><input id="slotName" maxlength="40" value="${mode === 'rename' ? escH(slotName()) : ''}" placeholder="Name, z. B. Handy" aria-label="Name"><button class="tool" type="submit">OK</button></form>`;
    const f = menu.querySelector('#slotForm');
    menu.querySelector('#slotName').focus();
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = menu.querySelector('#slotName').value;
      closeSlotMenu();
      if (mode === 'new') await switchSlot(null, name); else { slots = await id.renameSlot(game.id, slots.active, name); renderSlotBtn(); }
    });
    return;
  }
  menu.innerHTML = slots.list.map((x) => `<button class="it" role="menuitemradio" aria-checked="${x.id === slots.active}" data-slot="${x.id}">${escH(x.name)}</button>`).join('') +
    `<hr><button class="it act" data-act="new">+ Neuer Spielstand</button><button class="it act" data-act="rename">Umbenennen</button>` +
    (slots.list.length > 1 ? `<button class="it act" data-act="remove" style="color:#E3735F">„${escH(slotName())}“ entfernen</button>` : '') +
    `<div class="hint">Bestehende Spielstände von anderen Geräten holst du über „In Canopy ID übertragen“ auf der Spielseite.</div>`;
}
async function switchSlot(slotId, newName) {
  const cover = document.createElement('div'); cover.className = 'cover'; cover.textContent = 'Spielstand wird gewechselt …';
  stage.appendChild(cover);
  try {
    await askFlush();
    switching = true;
    if (slotId == null) { await id.createSlot(game.id, newName); }
    else await id.setActiveSlot(game.id, slotId);
    slots = await id.getSlots(game.id);
    renderSlotBtn();
    gameSaidHello = false;
    frame.src = frame.src; // Spiel neu laden, es holt sich den neuen Spielstand
  } catch (e) { switching = false; toast(`<b>Das hat nicht geklappt</b>${e.message}`); }
  finally { setTimeout(() => cover.remove(), 400); }
}
document.getElementById('slotBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const menu = document.getElementById('slotMenu');
  if (!menu.hidden) return closeSlotMenu();
  renderSlotMenu(); menu.hidden = false; e.currentTarget.setAttribute('aria-expanded', 'true');
});
document.getElementById('slotMenu').addEventListener('click', async (e) => {
  e.stopPropagation();
  const b = e.target.closest('[data-slot],[data-act]'); if (!b) return;
  if (b.dataset.slot) { const sid = +b.dataset.slot; closeSlotMenu(); if (sid !== slots.active) switchSlot(sid); return; }
  if (b.dataset.act === 'new') return renderSlotMenu('new');
  if (b.dataset.act === 'rename') return renderSlotMenu('rename');
  if (b.dataset.act === 'remove') {
    if (b.dataset.sure) { closeSlotMenu(); const gone = slots.active; await askFlush(); switching = true; slots = await id.removeSlot(game.id, gone); renderSlotBtn(); gameSaidHello = false; frame.src = frame.src; toast('<b>Spielstand entfernt</b>Er bleibt als Sicherung gespeichert und kann wiederhergestellt werden.'); }
    else { b.dataset.sure = '1'; b.textContent = 'Wirklich entfernen? Nochmal klicken'; }
  }
});
document.addEventListener('click', closeSlotMenu);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSlotMenu(); });

// Wer spielt, oben rechts anzeigen
const who = document.getElementById('who');
id.onChange((s) => {
  if (s.error || !s.user) { who.textContent = 'Anmelden'; who.href = 'account.html'; }
  else if (s.isGuest) { who.textContent = 'Gast · Fortschritt sichern'; who.href = 'account.html'; }
  else { who.textContent = s.name || 'Mein Account'; who.href = 'account.html'; }
  who.hidden = false;
  if (frame) send({ type: 'user', user: { name: s.name, guest: s.isGuest } });
});

function send(msg) { try { frame.contentWindow.postMessage({ canopy: 1, ...msg }, origin); } catch (e) {} }
const reply = (reqId, ok, resultOrError) => send(ok ? { type: 'reply', reqId, ok, result: resultOrError } : { type: 'reply', reqId, ok, error: resultOrError });

// Spielzeit: nur zählen, solange die Seite sichtbar ist. Alle 60 s und beim Verlassen speichern.
let playing = false, acc = 0, lastTick = 0;
function tick() { const now = performance.now(); if (playing && !document.hidden) acc += (now - lastTick) / 1000; lastTick = now; }
function flush() { tick(); const sec = Math.floor(acc); if (sec >= 5 && game) { acc -= sec; id.addPlaytime(game.id, sec).catch(() => {}); } }
setInterval(tick, 1000);
setInterval(flush, 60000);
document.addEventListener('visibilitychange', () => { tick(); if (document.hidden) flush(); });
addEventListener('pagehide', flush);

addEventListener('message', async (e) => {
  if (!frame || e.source !== frame.contentWindow) return;
  const m = e.data;
  if (!m || m.canopy !== 1) return;
  try {
    switch (m.type) {
      case 'ready':
        gameSaidHello = true; switching = false; document.getElementById('notLinked')?.remove();
        playing = true; lastTick = performance.now();
        id.ensureUser().then(() => { const s = id.state(); send({ type: 'user', user: { name: s.name, guest: s.isGuest } }); }).catch(() => {});
        break;
      case 'score':
        await id.ensureUser(); await id.reportScore(game.id, m.score);
        break;
      case 'load': {
        await slotsReady;
        const r = await id.loadSave(id.saveKey(game.id, slots.active));
        reply(m.reqId, true, { ...r, slot: slots.active, slotName: slotName() });
        break;
      }
      case 'flushed':
        if (flushWait[m.reqId]) { flushWait[m.reqId](); delete flushWait[m.reqId]; }
        break;
      case 'save':
        await slotsReady;
        if (switching) { reply(m.reqId, false, 'Spielstand wird gerade gewechselt.'); break; }
        reply(m.reqId, true, await id.writeSave(id.saveKey(game.id, slots.active), m.data, m.baseVersion));
        break;
      case 'call': {
        // Nur Funktionen, die für genau dieses Spiel freigegeben sind.
        const allowed = { 'foil-eleven': ['foilToken', 'foilLink'] }[game.id] || [];
        if (!allowed.includes(m.name)) throw new Error('Diese Funktion ist für dieses Spiel nicht freigegeben.');
        await id.ensureUser();
        reply(m.reqId, true, await id.callFunction(m.name, m.data || {}));
        break;
      }
    }
  } catch (err) {
    if (m.reqId) reply(m.reqId, false, err.message || 'Fehler');
  }
});

// Achievements als kleine Meldung unten rechts
function toast(html) {
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = html; document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}
id.onAchievement((a) => toast(`<b>Achievement freigeschaltet</b>${a.title} · ${a.desc}`));

// Feedback
const fbDlg = document.getElementById('fb');
let rating = 0;
fbDlg.querySelector('.stars').innerHTML = [1, 2, 3, 4, 5].map((n) => `<button type="button" data-r="${n}" aria-pressed="false" aria-label="${n} von 5">${n}</button>`).join('');
fbDlg.querySelector('.stars').addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; rating = +b.dataset.r; fbDlg.querySelectorAll('[data-r]').forEach((x) => x.setAttribute('aria-pressed', +x.dataset.r <= rating)); });
document.getElementById('fbBtn').addEventListener('click', () => { document.getElementById('fbMsg').textContent = ''; fbDlg.showModal(); });
document.getElementById('fbCancel').addEventListener('click', () => fbDlg.close());
document.getElementById('fbForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('fbText').value.trim(), msg = document.getElementById('fbMsg');
  if (!text && !rating) { msg.textContent = 'Schreib kurz etwas oder gib eine Bewertung ab.'; return; }
  const btn = document.getElementById('fbSend'); btn.disabled = true;
  try { await id.sendFeedback(game?.id || gameKey, rating, text); fbDlg.close(); document.getElementById('fbText').value = ''; rating = 0; toast('<b>Danke!</b>Dein Feedback ist angekommen.'); }
  catch (err) { msg.textContent = 'Senden hat nicht geklappt. Versuch es noch einmal.'; }
  finally { btn.disabled = false; }
});

fetch('games.json').then((r) => r.json()).then(({ games }) => {
  id.setGameIds((games || []).filter((x) => x.embed).map((x) => x.id));
  game = (games || []).find((x) => x.id === gameKey);
  if (!game || !game.url) return fail('Dieses Spiel gibt es nicht.');
  if (!game.embed) { location.replace(game.url); return; } // noch nicht Canopy-fähig: direkt öffnen
  if (game.slots) {
    slotsReady = id.getSlots(game.id).then((x) => { slots = x; renderSlotBtn(); document.getElementById('slotWrap').hidden = false; }).catch(() => {});
  }
  document.title = `${game.title} · Canopy Base`;
  document.getElementById('title').textContent = game.title;
  const direct = document.getElementById('direct');
  direct.href = game.url; direct.hidden = false;
  const url = new URL(game.url, location.href);
  origin = url.origin;
  frame = document.createElement('iframe');
  frame.src = url.href;
  frame.title = game.title;
  frame.allow = 'fullscreen; autoplay; gamepad; clipboard-write';
  stage.appendChild(frame);
  frame.addEventListener('load', () => {
    try { frame.contentWindow.focus(); } catch (e) {}
    // Meldet sich das Spiel nicht bei Canopy (z. B. alte Version ohne Canopy-SDK), würde es hier mit
    // leerem Spielstand starten. Dann lieber klar sagen, was los ist.
    setTimeout(() => {
      if (gameSaidHello || document.getElementById('notLinked')) return;
      const n = document.createElement('div');
      n.id = 'notLinked'; n.className = 'toast'; n.style.maxWidth = '420px';
      n.innerHTML = `<b>${game.title} ist noch nicht mit Canopy verbunden</b>Dein Spielstand wird hier nicht geladen. <a href="${game.url}" target="_blank" rel="noopener" style="color:var(--moss)">Direkt öffnen</a>`;
      document.body.appendChild(n);
    }, 10000);
  });
}).catch(() => fail('Die Spieleliste konnte nicht geladen werden. Lade die Seite neu.'));

document.getElementById('full').addEventListener('click', () => {
  (stage.requestFullscreen ? stage.requestFullscreen() : Promise.reject()).catch(() => {});
});
</script>
</body>
</html>
